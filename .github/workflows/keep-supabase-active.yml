name: Keep Supabase active

on:
  schedule:
    - cron: '17 13 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Perform a read-only database health check
        env:
          SUPABASE_URL: https://ahubumpcxhwppovllxvf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_YHrSpw4ytNAkPlb1cgc83g_XLlUIeX6
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 20 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/app_health?select=id&limit=1" >/dev/null
